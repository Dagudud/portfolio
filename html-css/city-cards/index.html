<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки городов</title>
</head>
<body>
    <div class="wrapper" name="top">
        <div class="photo-item">
            <div class="photo">
                <img src="img/Национальная библиотека.jpg" alt="">
                <div class="title">Беларусь, Минск</div>
                <div class="description">Национальная библиотека</div>
            </div>
        </div>
        <div class="photo-item">
            <div class="photo">
                <img src="img/Токийская башня.jpg" alt="">
                <div class="title">Токио</div>
                <div class="description">Токийская башня</div>
            </div>
        </div>
        <div class="photo-item">
            <div class="photo">
                <img src="img/Маями.jpg" alt="">
                <div class="title">Маями</div>
                <div class="description">Река на Маями</div>
            </div>
        </div>
        <div class="photo-item">
            <div class="photo">
                <img src="img/Греция.jpg" alt="">
                <div class="title">Греция</div>
                <div class="description">Колизей</div>
            </div>
        </div>
        <div class="photo-item">
            <div class="photo">
                <img src="img/Горы.jpg" alt="">
                <div class="title">Швейцария</div>
                <div class="description">Горы</div>
            </div>
        </div>
        <div class="photo-item">
            <div class="photo">
                <img src="img/London.jpg" alt="">
                <div class="title">Лондон</div>
                <div class="description">Биг Бен</div>
            </div>
        </div>
    </div>
    <a id="btnTop" href="#top">Вверх</a>
</body>
</html>
