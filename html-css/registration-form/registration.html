<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>
<body>
    <form autocomplete="off" method="post">
        <h1>Регистрация</h1>
        <p class="lit" id="l">Логин: </p>
        <input type="text" placeholder="Введите логин" required pattern="^([-_a-zA-Z0-9]){5,30}$">
        <p class="lit" id="t">Email: </p>
        <input type="email" placeholder="Введите email" required>
        <p class="lit">Пароль: </p>
        <input type="password" placeholder="Введите пароль" required>
        <p>Подтвердите пароль: </p>
        <input type="password" placeholder="Подтвердите пароль" required>
        <p id="p">Пол: </p>
        <div class="pol"> М
            <input type="radio" name="check" value="Man">
        </div>
        <div class="pol"> Ж
            <input type="radio" name="check" value="Woman">
        </div>
        <p>В какой стране вы живете <select>
            <option disabled selected>Выберите страну</option>
            <option value="">Беларусь</option>
            <option value="">Польша</option>
            <option value="">Россия</option>
            <option value="">Украина</option>
        </select></p>
        <input type="submit" value="Зарегестрироваться" id="w">
    </form>
</body>
</html>
